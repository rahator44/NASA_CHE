name: Earth Pulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scientific-backend-and-integrity:
    name: Backend Tests & Scientific Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install GDAL & System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Scientific Integrity & Provenance
        run: |
          chmod +x scripts/*.sh
          bash scripts/verify_integrity.sh

      - name: Execute Core Scientific & Deployment Test Suites
        run: |
          pytest tests/test_stage3_demo_readiness.py \
                 tests/test_frontend_api_handoff_contract.py \
                 tests/test_deployment_safety_gates.py \
                 tests/test_scientific_visualization.py

  frontend-build-and-test:
    name: Frontend Build & Type Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Unit & Integration Tests
        working-directory: frontend
        run: npm test

      - name: Build Production WebGIS Bundle
        working-directory: frontend
        run: npm run build

  security-and-secret-audit:
    name: Secret & Credential Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Audit Repository for Sensitive Tokens & Private Keys
        run: |
          echo "Scanning tracked files for potential secret leaks..."
          # Reject any tracked private credentials, .netrc files, or private keys
          if grep -rn --exclude-dir={.git,node_modules,.venv,dist,.github} --exclude=README.md -E "(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|urs.earthdata.nasa.gov.*password)" .; then
            echo "::error::Potential sensitive secret or private credential detected in repository files!"
            exit 1
          fi
          echo "No private keys or credentials detected."

